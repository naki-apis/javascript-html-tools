<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDrive Direct Link Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #1e3a8a;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      height: 100%;
      max-height: 100vh;
      background-color: #2563eb;
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      flex: 1 1 40%;
      padding: 16px 18px;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.5;
      resize: none;
      outline: none;
      background-color: #f0f7ff;
      color: #0b2a4a;
      overflow-y: auto;
      white-space: pre;
      word-break: break-all;
    }

    textarea::placeholder {
      color: #6b8db0;
      font-style: italic;
      opacity: 0.8;
    }

    textarea:focus {
      box-shadow: 0 0 0 3px #93c5fd;
    }

    button {
      align-self: center;
      padding: 14px 48px;
      font-size: 18px;
      font-weight: 600;
      color: #0b2a4a;
      background-color: #bae6fd;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    button:hover {
      background-color: #7dd3fc;
    }

    button:active {
      transform: scale(0.97);
      background-color: #a5d8f3;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .label {
      font-size: 14px;
      color: #dbeafe;
      padding-left: 6px;
      letter-spacing: 0.3px;
      font-weight: 500;
      text-transform: uppercase;
      opacity: 0.9;
      flex-shrink: 0;
    }

    .result-box {
      width: 100%;
      flex: 1 1 40%;
      padding: 16px 18px;
      border: none;
      border-radius: 20px;
      background-color: #e0f2fe;
      color: #0b2a4a;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.7;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .result-box a {
      color: #1d4ed8;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    .result-box a:hover {
      color: #1e3a8a;
      text-decoration-thickness: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="label">Input links</div>
    <textarea id="input" placeholder="Paste any Google Drive links here (one per line)…" spellcheck="false"></textarea>
    <button id="convertBtn">Convert</button>
    <div class="label">Direct download links</div>
    <div id="output" class="result-box" aria-live="polite"></div>
  </div>

  <script>
    (function() {
      const inputEl = document.getElementById('input');
      const outputEl = document.getElementById('output');
      const convertBtn = document.getElementById('convertBtn');

      function extractFileId(url) {
        if (!url || typeof url !== 'string') return null;
        const trimmed = url.trim();
        if (!trimmed) return null;

        const patterns = [
          /\/file\/d\/([a-zA-Z0-9_-]+)/,
          /[?&]id=([a-zA-Z0-9_-]+)/,
          /\/d\/([a-zA-Z0-9_-]+)/,
          /^([a-zA-Z0-9_-]{25,})$/
        ];

        for (const pattern of patterns) {
          const match = trimmed.match(pattern);
          if (match && match[1]) {
            return match[1];
          }
        }
        return null;
      }

      function buildDirectLink(fileId) {
        return `https://drive.google.com/uc?export=download&id=${fileId}`;
      }

      async function fetchFileName(directUrl) {
        try {
          const response = await fetch(directUrl, {
            method: 'GET',
            headers: { 'Range': 'bytes=0-0' }
          });

          const disposition = response.headers.get('Content-Disposition');
          if (disposition) {
            const utf8Match = disposition.match(/filename\*=UTF-8''([^;]+)/i);
            if (utf8Match && utf8Match[1]) {
              return decodeURIComponent(utf8Match[1]);
            }
            const asciiMatch = disposition.match(/filename="?([^";]+)"?/i);
            if (asciiMatch && asciiMatch[1]) {
              return asciiMatch[1];
            }
          }

          const contentType = response.headers.get('Content-Type') || '';
          const titleFromUrl = new URL(response.url).searchParams.get('id');
          if (contentType && !contentType.startsWith('text/html')) {
            return titleFromUrl || directUrl;
          }

          return titleFromUrl || directUrl;
        } catch (err) {
          return directUrl;
        }
      }

      async function processAll() {
        const lines = inputEl.value.split(/\r?\n/);
        const entries = [];

        for (const line of lines) {
          const fileId = extractFileId(line);
          if (!fileId) {
            entries.push({ empty: true });
            continue;
          }
          const directUrl = buildDirectLink(fileId);
          const name = await fetchFileName(directUrl);
          entries.push({ directUrl, name });
        }

        outputEl.innerHTML = '';
        entries.forEach((entry, index) => {
          if (entry.empty) {
            if (index < entries.length - 1) outputEl.appendChild(document.createElement('br'));
            return;
          }

          const a = document.createElement('a');
          a.href = entry.directUrl;
          a.textContent = entry.name;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.title = entry.directUrl;
          outputEl.appendChild(a);

          if (index < entries.length - 1) {
            outputEl.appendChild(document.createElement('br'));
          }
        });
      }

      convertBtn.addEventListener('click', async () => {
        convertBtn.disabled = true;
        convertBtn.textContent = 'Working…';
        try {
          await processAll();
        } finally {
          convertBtn.disabled = false;
          convertBtn.textContent = 'Convert';
        }
      });

      inputEl.addEventListener('paste', function() {
        setTimeout(() => convertBtn.click(), 0);
      });
    })();
  </script>
</body>
</html>
